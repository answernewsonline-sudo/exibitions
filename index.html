<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Room One Gallery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL room; quiet graphite overlay (HUD top-left, hints bottom, wall-label panel right / bottom sheet on phones).
   Single look by choice: the room is lit the same for every viewer, so the overlay keeps one dark palette. */
:root {
  --ink: #16181b;          /* panel ground */
  --ink-2: #23262b;        /* raised controls */
  --paper: #eef0ee;        /* panel text */
  --muted: #9aa1a6;        /* secondary text */
  --line: #3a3f45;         /* hairlines */
  --accent: #7fb2d9;       /* gallery blue: focus, active */
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: #d9dbd8; color: var(--paper); font-family: var(--display); overflow: hidden; overscroll-behavior: none; }
#stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#stage.pointing { cursor: pointer; }
canvas { display: block; }

.hud {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 32px);
}
.room-tag {
  background: var(--ink); border-radius: 4px; padding: 8px 12px; display: flex; gap: 10px; align-items: baseline;
}
.room-tag b { font-weight: 700; font-size: 14px; letter-spacing: .01em; }
.room-tag span { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
button {
  font: 500 13px/1 var(--display); color: var(--paper); background: var(--ink); border: 1px solid var(--line);
  border-radius: 4px; padding: 9px 12px; cursor: pointer;
}
button:hover { background: var(--ink-2); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.hints {
  position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 32px); pointer-events: none;
}
.hints span {
  background: rgba(22,24,27,.82); color: var(--paper); font-family: var(--mono); font-size: 11px; padding: 6px 9px; border-radius: 3px;
}
.hints kbd { font-family: inherit; color: var(--accent); }
.touch .hint-desk, .no-touch .hint-touch { display: none; }

.label {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(16px, env(safe-area-inset-right, 0px));
  max-height: calc(100% - 28px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  width: min(360px, calc(100% - 32px)); background: var(--ink); border-radius: 6px;
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateX(0); transition: transform .35s ease, opacity .35s ease;
}
.label.closed { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
.label-body { padding: 20px 20px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.cat { padding-right: 36px; gap: 12px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
.artist { font-size: 15px; font-weight: 500; }
.artist small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.title { font-size: 24px; line-height: 1.15; font-weight: 700; font-style: italic; margin: 0; text-wrap: balance; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; margin: 0; }
.facts dt { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
.desc { font-size: 14px; line-height: 1.55; color: #d4d8da; margin: 0; }
.note { font-family: var(--mono); font-size: 10.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
.label-nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); }
.label-nav .count { font-family: var(--mono); font-size: 12px; color: var(--muted); align-self: center; text-align: center; font-variant-numeric: tabular-nums; }
.close { position: absolute; top: 12px; right: 12px; padding: 6px 9px; font-size: 16px; line-height: 1; }

.loading { position: fixed; inset: 0; display: grid; place-items: center; background: #d9dbd8; color: #16181b; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; transition: opacity .5s; }
.loading.done { opacity: 0; pointer-events: none; }

@media (max-width: 640px) {
  .label { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); left: max(16px, env(safe-area-inset-left, 0px)); width: auto; max-height: 52%; }
  .label.closed { transform: translateY(calc(100% + 24px)); }
  .title { font-size: 20px; }
  .label-body { padding: 16px 16px 6px; gap: 10px; }
  .label-nav { padding: 10px 16px 12px; }
}
@media (prefers-reduced-motion: reduce) { .label, .loading { transition: none; } }
</style>

<div id="stage" aria-label="3D gallery room. Drag to look, tap the floor to walk, tap an artwork for its label." role="application"></div>
<div class="loading" id="loading">Hanging the works…</div>

<div class="hud">
  <div class="room-tag"><b>Room One</b><span>7 works</span></div>

</div>

<div class="hints" id="hints">

<aside class="label closed" id="label" aria-live="polite" aria-hidden="true">

  <div class="label-body">
    <div class="cat"><span id="lCat">Cat. 01</span><span id="lWall">North wall</span></div>

  </div>
</aside>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";

// Wait briefly for web fonts so the canvas-drawn wall labels use them.
try { await Promise.race([Promise.all([document.fonts.load("600 34px Archivo"), document.fonts.load("italic 600 30px Archivo"), document.fonts.load("400 24px 'IBM Plex Mono'")]), new Promise(r => setTimeout(r, 1500))]); } catch {}

/* ---------- Content ---------- */
const WORKS = [
  { id: 1, artist: "Mara Ellison", born: "b. 1981, Galway", title: "Low Tide, Second Hour", year: "2019", medium: "Oil on linen", w: 120, h: 90, wall: "N", at: -3.4, paint: "bands",
    desc: "Three horizontal fields of colour stacked like the bands of an exposed shoreline. Ellison builds each field in thin glazes over several weeks, so the edges soften where the layers overlap." },
  { id: 2, artist: "Tomasz Wrona", born: "b. 1975, Łódź", title: "Field Notes (Grid 7)", year: "2021", medium: "Acrylic and graphite on panel", w: 100, h: 100, wall: "N", at: 3.4, paint: "grid",
    desc: "A seven-by-seven grid of discs, each a slightly different size. Wrona records daily rainfall and turns each reading into one disc, so the panel is a month and a half of weather." },
  { id: 3, artist: "Ines Okafor", born: "b. 1990, Lagos", title: "Drift", year: "2022", medium: "Ink on cotton paper", w: 140, h: 90, wall: "W", at: -2.2, paint: "flow",
    desc: "Thousands of short ink strokes follow an invisible current across the sheet. Okafor draws without lifting her hand for long stretches, letting the line wander and bunch." },
  { id: 4, artist: "Kenji Aramaki", born: "b. 1968, Sapporo", title: "Interval", year: "2018", medium: "Acrylic on canvas", w: 90, h: 120, wall: "W", at: 2.6, paint: "geo",
    desc: "Rectangles meet at hard edges and leave narrow gaps of bare ground between them. Aramaki treats those gaps as the subject: the pauses between notes rather than the notes." },
  { id: 5, artist: "Ruth Calloway", born: "b. 1959, Norfolk", title: "Saltmarsh, Evening", year: "2020", medium: "Oil on canvas", w: 170, h: 80, wall: "E", at: -1.6, paint: "horizon",
    desc: "A low horizon under a wide sky, painted from memory of the North Norfolk coast. The marsh is reduced to a dark strip so the light above it carries the picture." },
  { id: 6, artist: "Lea Brandt", born: "b. 1994, Leipzig", title: "Counterweight", year: "2023", medium: "Gouache on board", w: 80, h: 100, wall: "E", at: 2.8, paint: "stack",
    desc: "Flat shapes balanced on one another like a stack of stones about to topple. Brandt cuts paper models first, then paints the arrangement that held still longest." },
  { id: 7, artist: "Sami Haddad", born: "b. 1986, Beirut", title: "Knot for a Quiet Room", year: "2024", medium: "Patinated bronze on painted plinth", w: 60, h: 60, d: 45, wall: "C", paint: "sculpture",
    desc: "A single continuous loop folded through itself. Walk around it: from the entrance it reads as a ring, from the side as a tangle." },
];
const WALL_NAME = { N: "North wall", W: "West wall", E: "East wall", C: "Centre plinth" };

/* ---------- Room constants (metres) ---------- */
const RX = 8, RZ = 6, RH = 4.4, EYE = 1.62, ART_Y = 1.62;
const PLINTH = new THREE.Vector3(0, 0, 0.4), PLINTH_R = 1.05, MARGIN = 0.55;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isTouch = matchMedia("(pointer: coarse)").matches;
document.documentElement.classList.add(isTouch ? "touch" : "no-touch");

/* ---------- Renderer ---------- */
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9dbd8);
const camera = new THREE.PerspectiveCamera(62, 1, 0.05, 60);
camera.rotation.order = "YXZ";

/* ---------- Helpers ---------- */
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function canvasTex(w, h, draw, { repeat, srgb = true } = {}) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}

/* ---------- Room shell ---------- */
const floorTex = canvasTex(1024, 1024, (g, w, h) => {
  const r = rng(11); const plank = w / 8;
  for (let i = 0; i < 8; i++) {
    let y = -r() * h;
    while (y < h) {
      const len = h * (0.35 + r() * 0.5), tone = 196 + r() * 22;
      g.fillStyle = `rgb(${tone},${tone - 22},${tone - 52})`;
      g.fillRect(i * plank, y, plank, len);
      g.globalAlpha = 0.08;
      for (let k = 0; k < 14; k++) { g.fillStyle = r() > .5 ? "#6b4f2c" : "#fff4dc"; g.fillRect(i * plank + r() * plank, y, 1 + r() * 2, len); }
      g.globalAlpha = 1; g.fillStyle = "rgba(70,50,30,.45)"; g.fillRect(i * plank, y, plank, 2); g.fillRect(i * plank, y, 2, len);
      y += len;
    }
  }
}, { repeat: [2, 1.5] });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(RX * 2, RZ * 2), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.55, metalness: 0 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; floor.name = "floor";
scene.add(floor);

const wallMat = new THREE.MeshStandardMaterial({ color: 0xf1f2ef, roughness: 0.95 });
function wall(w, h, x, z, ry) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallMat);
  m.position.set(x, h / 2, z); m.rotation.y = ry; m.receiveShadow = true; scene.add(m); return m;
}
wall(RX * 2, RH, 0, -RZ, 0);
wall(RZ * 2, RH, -RX, 0, Math.PI / 2);
wall(RZ * 2, RH, RX, 0, -Math.PI / 2);
wall(RX * 2, RH, 0, RZ, Math.PI);

// Skirting boards
const skirtMat = new THREE.MeshStandardMaterial({ color: 0xd8dad6, roughness: 0.8 });
[[RX * 2, 0, -RZ + 0.01, 0], [RX * 2, 0, RZ - 0.01, Math.PI], [RZ * 2, -RX + 0.01, 0, Math.PI / 2], [RZ * 2, RX - 0.01, 0, -Math.PI / 2]].forEach(([w, x, z, ry]) => {
  const s = new THREE.Mesh(new THREE.BoxGeometry(w, 0.1, 0.02), skirtMat); s.position.set(x, 0.05, z); s.rotation.y = ry; scene.add(s);
});

// Entrance on the south wall
const door = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 2.7), new THREE.MeshBasicMaterial({ color: 0x2b2e31 }));
door.position.set(0, 1.35, RZ - 0.005); door.rotation.y = Math.PI; scene.add(door);
const exitSign = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.16), new THREE.MeshBasicMaterial({ map: canvasTex(512, 92, (g, w, h) => { g.fillStyle = "#f1f2ef"; g.fillRect(0, 0, w, h); g.fillStyle = "#16181b"; g.font = "600 44px Archivo, Arial"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("ROOM ONE", w / 2, h / 2 + 2); }) }));
exitSign.position.set(0, 3.0, RZ - 0.006); exitSign.rotation.y = Math.PI; scene.add(exitSign);

// Ceiling with skylight slots
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(RX * 2, RZ * 2), new THREE.MeshStandardMaterial({ color: 0x9a9c99, emissive: 0xb9bbb8, roughness: 1 }));
ceil.rotation.x = Math.PI / 2; ceil.position.y = RH; scene.add(ceil);
const slotMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
for (const z of [-3.6, 0, 3.6]) { const s = new THREE.Mesh(new THREE.PlaneGeometry(RX * 1.6, 0.5), slotMat); s.rotation.x = Math.PI / 2; s.position.set(0, RH - 0.01, z); scene.add(s); }

/* ---------- Lights ---------- */
scene.add(new THREE.HemisphereLight(0xffffff, 0xcab89a, 1.25));
const key = new THREE.DirectionalLight(0xfff6ea, 0.9);
key.position.set(2.5, RH - 0.2, 2.5); key.target.position.set(0, 0, 0.4);
key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.camera.near = 0.5; key.shadow.camera.far = 10;
Object.assign(key.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2 }); key.shadow.bias = -0.0005; key.shadow.radius = 6;
scene.add(key, key.target);

/* ---------- Paintings ---------- */
const PAINTERS = {
  bands(g, w, h, r) {
    g.fillStyle = "#2d3a44"; g.fillRect(0, 0, w, h);
    const cols = ["#c8b48a", "#5f7f8c", "#22313b"];
    let y = h * 0.06;
    [0.36, 0.28, 0.24].forEach((f, i) => {
      for (let k = 0; k < 40; k++) { g.globalAlpha = 0.05; g.fillStyle = cols[i]; const j = r() * 10; g.fillRect(w * 0.07 - j, y - j, w * 0.86 + 2 * j, h * f - 8 + 2 * j); }
      g.globalAlpha = 0.85; g.fillStyle = cols[i]; g.fillRect(w * 0.08, y, w * 0.84, h * f - 10); y += h * f + 4;
    });
    g.globalAlpha = 1;
  },
  grid(g, w, h, r) {
    g.fillStyle = "#ecebe4"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(60,60,60,.25)"; g.lineWidth = 1;
    const n = 7, cell = w / (n + 1);
    for (let i = 1; i <= n; i++) { g.beginPath(); g.moveTo(cell * i, cell * .6); g.lineTo(cell * i, h - cell * .6); g.stroke(); g.beginPath(); g.moveTo(cell * .6, cell * i); g.lineTo(w - cell * .6, cell * i); g.stroke(); }
    for (let i = 1; i <= n; i++) for (let j = 1; j <= n; j++) {
      const rad = cell * (0.08 + r() * r() * 0.42);
      g.fillStyle = r() > 0.86 ? "#b5452f" : "#1f2a33"; g.beginPath(); g.arc(cell * i, cell * j, rad, 0, Math.PI * 2); g.fill();
    }
  },
  flow(g, w, h, r) {
    g.fillStyle = "#f3f0e8"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(20,28,40,.55)"; g.lineWidth = 1.2;
    const field = (x, y) => Math.sin(x * 0.006) * 1.4 + Math.cos(y * 0.009 + x * 0.002) * 1.1;
    for (let i = 0; i < 1400; i++) {
      let x = r() * w, y = r() * h; g.beginPath(); g.moveTo(x, y);
      for (let s = 0; s < 22; s++) { const a = field(x, y); x += Math.cos(a) * 4; y += Math.sin(a) * 4; g.lineTo(x, y); }
      g.stroke();
    }
  },
  geo(g, w, h, r) {
    g.fillStyle = "#e9e4d8"; g.fillRect(0, 0, w, h);
    const pal = ["#1d2b3a", "#c9a227", "#9a3b2b", "#3f6f73", "#d9d2c0", "#1d2b3a"];
    const gap = 14; let y = gap;
    while (y < h - gap) {
      const rh = Math.min(h - gap - y, 60 + r() * 220); let x = gap;
      while (x < w - gap) { const rw = Math.min(w - gap - x, 50 + r() * 260); g.fillStyle = pal[(r() * pal.length) | 0]; g.fillRect(x, y, rw - gap, rh - gap); x += rw; }
      y += rh;
    }
  },
  horizon(g, w, h) {
    const sky = g.createLinearGradient(0, 0, 0, h * 0.78);
    sky.addColorStop(0, "#3c5a78"); sky.addColorStop(0.55, "#b7a28f"); sky.addColorStop(1, "#e8c49a");
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    g.fillStyle = "#283028"; g.fillRect(0, h * 0.78, w, h * 0.22);
    g.fillStyle = "rgba(232,196,154,.5)"; g.fillRect(w * 0.1, h * 0.84, w * 0.5, 3); g.fillRect(w * 0.55, h * 0.9, w * 0.3, 2);
  },
  stack(g, w, h) {
    g.fillStyle = "#dcd6c8"; g.fillRect(0, 0, w, h);
    const parts = [["#2a3640", .5, .86, .62, .16], ["#b8562f", .46, .70, .42, .14], ["#e7c25b", .55, .57, .30, .12], ["#4c7a6a", .48, .44, .22, .13], ["#2a3640", .52, .31, .12, .10]];
    for (const [c, cx, cy, rw, rh] of parts) { g.fillStyle = c; g.beginPath(); g.ellipse(w * cx, h * cy, w * rw / 2, h * rh / 2, (cx - .5) * .6, 0, Math.PI * 2); g.fill(); }
  },
};

const wallPose = (wallId, at) => {
  if (wallId === "N") return { pos: new THREE.Vector3(at, ART_Y, -RZ + 0.03), ry: 0, n: new THREE.Vector3(0, 0, 1) };
  if (wallId === "W") return { pos: new THREE.Vector3(-RX + 0.03, ART_Y, at), ry: Math.PI / 2, n: new THREE.Vector3(1, 0, 0) };
  return { pos: new THREE.Vector3(RX - 0.03, ART_Y, at), ry: -Math.PI / 2, n: new THREE.Vector3(-1, 0, 0) };
};

const clickables = [];
const frameMat = new THREE.MeshStandardMaterial({ color: 0x1b1c1e, roughness: 0.6 });
const matMat = new THREE.MeshStandardMaterial({ color: 0xf6f5f0, roughness: 0.9 });

function plaqueTex(wk) {
  return canvasTex(512, 300, (g, w, h) => {
    g.fillStyle = "#fbfbf8"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#16181b"; g.textBaseline = "top";
    g.font = "600 34px Archivo, Arial"; g.fillText(wk.artist, 28, 30);
    g.font = "italic 600 30px Archivo, Arial"; g.fillText(wk.title.length > 26 ? wk.title.slice(0, 25) + "…" : wk.title, 28, 82);
    g.font = "400 24px 'IBM Plex Mono', monospace"; g.fillStyle = "#555"; g.fillText(wk.year, 28, 132);
    g.fillText(wk.medium.length > 30 ? wk.medium.slice(0, 29) + "…" : wk.medium, 28, 166);
    g.fillText(`${wk.w} × ${wk.h}${wk.d ? " × " + wk.d : ""} cm`, 28, 200);
    g.fillText(`Cat. ${String(wk.id).padStart(2, "0")}`, 28, 248);
  });
}

WORKS.forEach((wk, idx) => {
  wk.index = idx;
  if (wk.paint === "sculpture") return;
  const W = wk.w / 100, H = wk.h / 100, pose = wallPose(wk.wall, wk.at);
  const grp = new THREE.Group(); grp.position.copy(pose.pos); grp.rotation.y = pose.ry;
  const pad = 0.07, fr = 0.035, depth = 0.045;
  const frame = new THREE.Mesh(new THREE.BoxGeometry(W + 2 * (pad + fr), H + 2 * (pad + fr), depth), frameMat);
  frame.position.z = depth / 2; frame.castShadow = true;
  const mat = new THREE.Mesh(new THREE.PlaneGeometry(W + 2 * pad, H + 2 * pad), matMat); mat.position.z = depth + 0.001;
  const pxW = 1024, pxH = Math.round(1024 * H / W);
  const art = new THREE.Mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshStandardMaterial({ map: canvasTex(pxW, pxH, (g, w, h) => PAINTERS[wk.paint](g, w, h, rng(idx * 97 + 5))), roughness: 0.75 }));
  art.position.z = depth + 0.002;
  grp.add(frame, mat, art);
  // Wall label beside the frame
  const plaque = new THREE.Mesh(new THREE.PlaneGeometry(0.24, 0.14), new THREE.MeshStandardMaterial({ map: plaqueTex(wk), roughness: 0.9 }));
  plaque.position.set(W / 2 + pad + fr + 0.28, -0.32, 0.004);
  grp.add(plaque);
  [frame, mat, art, plaque].forEach(m => { m.userData.work = idx; clickables.push(m); });
  scene.add(grp);
  // Picture light from the ceiling
  const spot = new THREE.SpotLight(0xfff1dc, 26, 7, 0.36, 0.7, 1.6);
  spot.position.copy(pose.pos).addScaledVector(pose.n, 1.8).setY(RH - 0.1);
  spot.target.position.copy(pose.pos);
  scene.add(spot, spot.target);
  wk.center = pose.pos.clone(); wk.normal = pose.n.clone();
  wk.size = { w: W + 0.9, h: H + 0.6 };
});

/* ---------- Sculpture on plinth ---------- */
{
  const wk = WORKS[6];
  const plinthMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f2, roughness: 0.85 });
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.95, 0.7), plinthMat);
  plinth.position.set(PLINTH.x, 0.475, PLINTH.z); plinth.castShadow = plinth.receiveShadow = true;
  const bronze = new THREE.MeshStandardMaterial({ color: 0x6d4a2c, metalness: 0.85, roughness: 0.38 });
  const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(0.2, 0.055, 220, 28, 2, 3), bronze);
  knot.position.set(PLINTH.x, 0.95 + 0.33, PLINTH.z); knot.castShadow = true;
  const plaque = new THREE.Mesh(new THREE.PlaneGeometry(0.24, 0.14), new THREE.MeshStandardMaterial({ map: plaqueTex(wk), roughness: 0.9 }));
  plaque.position.set(PLINTH.x, 0.72, PLINTH.z + 0.352);
  scene.add(plinth, knot, plaque);
  [plinth, knot, plaque].forEach(m => { m.userData.work = 6; clickables.push(m); });
  wk.knot = knot;
  wk.center = knot.position.clone(); wk.normal = new THREE.Vector3(0, 0, 1);
  wk.normal = new THREE.Vector3(0.43, 0, 0.9).normalize(); wk.size = { w: 1.9, h: 2.1 };
  wk.lookAt = knot.position.clone().setY(1.2);
}

/* ---------- Floor reticle ---------- */
const reticle = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.2, 40), new THREE.MeshBasicMaterial({ color: 0x2c6a9a, transparent: true, opacity: 0.75, depthWrite: false }));
reticle.rotation.x = -Math.PI / 2; reticle.position.y = 0.005; reticle.visible = false; scene.add(reticle);

/* ---------- Camera state & movement ---------- */
const START = { pos: new THREE.Vector3(0, EYE, RZ - 1.3), yaw: 0, pitch: -0.03 };
const cam = { pos: START.pos.clone(), yaw: START.yaw, pitch: START.pitch };
let tween = null;

function clampPos(p) {
  p.x = THREE.MathUtils.clamp(p.x, -RX + MARGIN, RX - MARGIN);
  p.z = THREE.MathUtils.clamp(p.z, -RZ + MARGIN, RZ - MARGIN);
  const dx = p.x - PLINTH.x, dz = p.z - PLINTH.z, d = Math.hypot(dx, dz);
  if (d < PLINTH_R) { const k = PLINTH_R / (d || 1e-4); p.x = PLINTH.x + (d ? dx : 0) * k; p.z = PLINTH.z + (d ? dz : 1) * k; }
  p.y = EYE; return p;
}
function anglesTo(from, target) {
  const d = target.clone().sub(from);
  return { yaw: Math.atan2(-d.x, -d.z), pitch: Math.atan2(d.y, Math.hypot(d.x, d.z)) };
}
function shortest(a, b) { let d = (b - a) % (Math.PI * 2); if (d > Math.PI) d -= Math.PI * 2; if (d < -Math.PI) d += Math.PI * 2; return a + d; }
function moveTo(pos, yaw = cam.yaw, pitch = cam.pitch, dur) {
  const to = clampPos(pos.clone());
  const dist = to.distanceTo(cam.pos);
  dur = dur ?? THREE.MathUtils.clamp(0.5 + dist * 0.22, 0.6, 2.2);
  if (reduceMotion) dur = 0.01;
  tween = { t: 0, dur, from: { pos: cam.pos.clone(), yaw: cam.yaw, pitch: cam.pitch }, to: { pos: to, yaw: shortest(cam.yaw, yaw), pitch } };
}
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* ---------- Label panel ---------- */
const $ = id => document.getElementById(id);
const label = $("label");
let current = -1;
function openWork(i, { fly = true } = {}) {
  i = (i + WORKS.length) % WORKS.length; current = i;
  const wk = WORKS[i];
  $("lCat").textContent = `Cat. ${String(wk.id).padStart(2, "0")}`;
  $("lWall").textContent = WALL_NAME[wk.wall];
  $("lArtist").innerHTML = ""; $("lArtist").append(wk.artist, Object.assign(document.createElement("small"), { textContent: wk.born }));
  $("lTitle").textContent = wk.title;
  $("lYear").textContent = wk.year; $("lMedium").textContent = wk.medium;
  $("lSize").textContent = `${wk.h} × ${wk.w}${wk.d ? " × " + wk.d : ""} cm`;
  $("lDesc").textContent = wk.desc;
  $("lCount").textContent = `${i + 1} / ${WORKS.length}`;
  label.classList.remove("closed"); label.setAttribute("aria-hidden", "false");
  if (fly) {
    // Stand far enough back that the whole work fits in the part of the screen the label leaves free.
    const t = Math.tan(THREE.MathUtils.degToRad(baseFov()) / 2), w = innerWidth, h = innerHeight;
    const r = label.getBoundingClientRect(), desk = w > 640;
    const wf = desk ? w - r.width - 14 : w, hf = desk ? h : h - r.height - 14;
    const dist = Math.max(1.8, (wk.size.w / 2) / (t * wf / h), (wk.size.h / 2) / (t * hf / h));
    const view = wk.center.clone().addScaledVector(wk.normal, dist).setY(EYE);
    const a = anglesTo(view, wk.lookAt || wk.center);
    moveTo(view, a.yaw, a.pitch);
  }
}
function closeLabel() { current = -1; label.classList.add("closed"); label.setAttribute("aria-hidden", "true"); }
$("closeBtn").onclick = closeLabel;
$("prevBtn").onclick = () => openWork(current - 1);
$("nextBtn").onclick = () => openWork(current + 1);
$("tourBtn").onclick = () => openWork(current < 0 ? 0 : current + 1);
$("resetBtn").onclick = () => { closeLabel(); moveTo(START.pos, START.yaw, START.pitch); };

/* ---------- Pointer: drag to look, tap to walk / open ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(x, y) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((x - r.left) / r.width) * 2 - 1, -((y - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects([...clickables, floor], false)[0];
  return hit || null;
}
const pointers = new Map();
let drag = null;
stage.addEventListener("pointerdown", e => {
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), moved: false, id: e.pointerId };
});
stage.addEventListener("pointermove", e => {
  if (drag && e.pointerId === drag.id) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) { drag.moved = true; stage.classList.add("dragging"); }
    if (drag.moved) {
      const k = (isTouch ? 0.005 : 0.0038);
      cam.yaw += dx * k; cam.pitch = THREE.MathUtils.clamp(cam.pitch + dy * k, -1.2, 1.2);
      if (tween) { tween.to.yaw = cam.yaw; tween.to.pitch = cam.pitch; tween.lookFree = true; }
    }
    reticle.visible = false;
    return;
  }
  if (e.pointerType === "mouse") {
    const hit = pick(e.clientX, e.clientY);
    stage.classList.toggle("pointing", !!hit);
    if (hit && hit.object === floor) { reticle.position.set(hit.point.x, 0.005, hit.point.z); clampPos(reticle.position).y = 0.005; reticle.visible = true; }
    else reticle.visible = false;
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (!drag || e.pointerId !== drag.id) return;
  const wasTap = !drag.moved && performance.now() - drag.t < 500;
  drag = null; stage.classList.remove("dragging");
  if (!wasTap || e.type === "pointercancel") return;
  const hit = pick(e.clientX, e.clientY);
  if (!hit) return;
  if (hit.object.userData.work !== undefined) openWork(hit.object.userData.work);
  else if (hit.object === floor) { moveTo(new THREE.Vector3(hit.point.x, EYE, hit.point.z)); }
}
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);
stage.addEventListener("pointerleave", () => { reticle.visible = false; });
stage.addEventListener("wheel", e => {
  e.preventDefault(); tween = null;
  const step = -Math.sign(e.deltaY) * 0.35;
  cam.pos.x += -Math.sin(cam.yaw) * step; cam.pos.z += -Math.cos(cam.yaw) * step; clampPos(cam.pos);
}, { passive: false });

/* ---------- Keyboard ---------- */
const keys = new Set();
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("button")) { if (e.key !== "Escape") return; }
  if (e.key === "Escape") { closeLabel(); return; }
  if (current >= 0 && (e.key === "]" || e.key === "PageDown")) { openWork(current + 1); return; }
  if (current >= 0 && (e.key === "[" || e.key === "PageUp")) { openWork(current - 1); return; }
  keys.add(e.key.toLowerCase());
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(e.key.toLowerCase())) e.preventDefault();
});
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());

/* ---------- Loop ---------- */
// Shift the view centre away from the label panel so the work sits in the free space.
const shift = { x: 0, y: 0 };
function panelShift() {
  if (current < 0) return { x: 0, y: 0 };
  const r = label.getBoundingClientRect();
  return innerWidth > 640 ? { x: r.width + 14, y: 0 } : { x: 0, y: r.height + 14 };
}
const baseFov = () => innerWidth / innerHeight < 0.8 ? 72 : 62;
function applyView() {
  const w = innerWidth, h = innerHeight, fw = w + shift.x, fh = h + shift.y;
  camera.aspect = fw / fh;
  // Keep the on-screen scale unchanged when the frustum grows to make room for the shift.
  camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(baseFov()) / 2) * fh / h));
  if (shift.x > 0.5 || shift.y > 0.5) camera.setViewOffset(fw, fh, shift.x, shift.y, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); renderer.domElement.style.width = w + "px"; renderer.domElement.style.height = h + "px";
  applyView();
}
addEventListener("resize", resize); resize();

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  // Keyboard movement
  const fwd = (keys.has("w") || keys.has("arrowup") ? 1 : 0) - (keys.has("s") || keys.has("arrowdown") ? 1 : 0);
  const side = (keys.has("d") ? 1 : 0) - (keys.has("a") ? 1 : 0);
  const turn = (keys.has("arrowleft") || keys.has("q") ? 1 : 0) - (keys.has("arrowright") || keys.has("e") ? 1 : 0);
  if (fwd || side || turn) {
    tween = null;
    cam.yaw += turn * 1.6 * dt;
    const sp = (keys.has("shift") ? 3.2 : 1.8) * dt;
    cam.pos.x += (-Math.sin(cam.yaw) * fwd + Math.cos(cam.yaw) * side) * sp;
    cam.pos.z += (-Math.cos(cam.yaw) * fwd - Math.sin(cam.yaw) * side) * sp;
    clampPos(cam.pos);
  }
  if (tween) {
    tween.t += dt / tween.dur; const k = ease(Math.min(tween.t, 1));
    cam.pos.lerpVectors(tween.from.pos, tween.to.pos, k);
    if (!tween.lookFree) { cam.yaw = THREE.MathUtils.lerp(tween.from.yaw, tween.to.yaw, k); cam.pitch = THREE.MathUtils.lerp(tween.from.pitch, tween.to.pitch, k); }
    if (tween.t >= 1) tween = null;
  }
  // Gentle step bob while walking
  const bob = tween && !reduceMotion ? Math.sin(tween.t * Math.PI * 6) * 0.012 * Math.sin(tween.t * Math.PI) : 0;
  camera.position.set(cam.pos.x, cam.pos.y + bob, cam.pos.z);
  camera.rotation.set(cam.pitch, cam.yaw, 0);
  const ps = panelShift(), kk = reduceMotion ? 1 : Math.min(1, dt * 6);
  if (Math.abs(ps.x - shift.x) > 0.5 || Math.abs(ps.y - shift.y) > 0.5) { shift.x += (ps.x - shift.x) * kk; shift.y += (ps.y - shift.y) * kk; applyView(); }
  if (!reduceMotion) WORKS[6].knot.rotation.y += dt * 0.12;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(() => { $("loading").classList.add("done"); frame(); });
window.__gallery = { openWork, moveTo, cam, WORKS, scene, THREE };
</script>
